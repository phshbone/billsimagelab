name: Build Smart Select 6.9

on:
  push:
    branches:
      - feature/smart-select-6.9

permissions:
  contents: write

jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/smart-select-6.9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply Smart Select patch
        run: |
          python tools/build_smart_select_69.py
          sed -i 's/smartModule.BrushMode.NEGATIVE/2/g; s/smartModule.BrushMode.POSITIVE/1/g' index.html
          python tools/build_smart_select_69.py

      - name: Static smoke test
        run: node --check /tmp/image-lab-app.js

      - name: Install browser smoke runtime
        run: |
          mkdir -p /tmp/image-lab-smoke
          npm install --prefix /tmp/image-lab-smoke playwright
          /tmp/image-lab-smoke/node_modules/.bin/playwright install --with-deps chromium

      - name: Browser smoke test Smart Select
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/image-lab-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node tools/smart_select_smoke.cjs

      - name: Commit Build 6.9 when tests pass
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Build 6.9: add on-device Smart Select object extraction'
          git push origin HEAD:feature/smart-select-6.9
