name: Build Smart Select 6.9

on:
  push:
    branches:
      - feature/smart-select-6.9

permissions:
  contents: write

jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/smart-select-6.9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply Smart Select patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          if 'Build 6.9' in text and 'Smart Select Object' in text:
              print('Build 6.9 patch already present; leaving source unchanged.')
              raise SystemExit(0)

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '<span class="buildBadge">Build 6.8</span>',
              '<span class="buildBadge">Build 6.9</span>',
              'build badge'
          )
          replace_once(
              '<span id="taskLine">State Repair: safe canvas sizing, full undo, and persistent touch-up.</span>',
              '<span id="taskLine">Smart Select: tap an object, refine the mask, then keep or remove it.</span>',
              'task line'
          )

          replace_once(
              '  .hasImage canvas{display:block}\n\n  .empty{',
              '''  .hasImage canvas{display:block}
  .page .selectionOverlay{
    position:absolute;inset:0;width:100%;height:100%;
    display:none;pointer-events:none;z-index:3;
  }
  .page.hasSmartSelection .selectionOverlay{display:block}

  .empty{''',
              'selection overlay CSS'
          )
          replace_once(
              '  .toolBtn.active{border-color:rgba(125,255,168,.48);background:linear-gradient(135deg,rgba(125,255,168,.20),rgba(255,255,255,.06))}\n  .hint{',
              '''  .toolBtn.active{border-color:rgba(125,255,168,.48);background:linear-gradient(135deg,rgba(125,255,168,.20),rgba(255,255,255,.06))}
  .toolBtn:disabled{opacity:.42;cursor:not-allowed;filter:grayscale(.35)}
  .smartControls{margin-top:9px}
  .hint{''',
              'smart controls CSS'
          )

          replace_once(
              '          <canvas id="canvas"></canvas>\n          <div class="empty">',
              '          <canvas id="canvas"></canvas>\n          <canvas class="selectionOverlay" id="selectionOverlay" aria-hidden="true"></canvas>\n          <div class="empty">',
              'selection overlay canvas'
          )

          replace_once(
              '''    baseRemovalMask:null,
    manualEraseMask:null,
    manualRestoreMask:null,
    mode:null,''',
              '''    baseRemovalMask:null,
    manualEraseMask:null,
    manualRestoreMask:null,
    smartSelectionMask:null,
    smartStrokes:[],
    smartPromptMode:"positive",
    smartModelStatus:"idle",
    smartImagePrepared:false,
    smartBusy:false,
    mode:null,''',
              'smart state'
          )

          replace_once(
              '''  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d", {willReadFrequently:true});
  const brushCursor = document.getElementById("brushCursor");''',
              '''  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d", {willReadFrequently:true});
  const selectionOverlay = document.getElementById("selectionOverlay");
  const selectionCtx = selectionOverlay.getContext("2d", {willReadFrequently:true});
  const brushCursor = document.getElementById("brushCursor");
  const smartSourceCanvas = document.createElement("canvas");
  const smartSourceCtx = smartSourceCanvas.getContext("2d", {willReadFrequently:true});
  let smartModule=null;
  let smartSegmenter=null;''',
              'smart DOM refs'
          )

          replace_once(
              '<div class="eyebrow">build 6.8 · state repair</div>',
              '<div class="eyebrow">build 6.9 · smart select</div>',
              'panel build label'
          )

          old_remove = '''          <div class="toolGrid">
            <button class="toolBtn primary full" data-action="quick-remove">Quick Remove Background</button>
            <button class="toolBtn ${state.mode==="wand"?"active":""}" data-action="wand">Magic Wand</button>
            <button class="toolBtn" data-action="similar-white">Remove Similar White</button>
          </div>
          <div class="sliderRow">
            <label>Tolerance <span data-bind="tol">${state.tolerance}</span></label>
            <input data-action="tolerance" type="range" min="0" max="120" value="${state.tolerance}">
          </div>
          <div class="hint">Quick Remove makes the first cut. Magic Wand stays active for repeated cleanup clicks until you choose another tool or press Escape.</div>'''
          new_remove = '''          <div class="toolGrid">
            <button class="toolBtn primary full" data-action="quick-remove">Quick Remove Background</button>
            <button class="toolBtn ${state.mode==="smart-select"?"active":""} full" data-action="smart-select">Smart Select Object</button>
            <button class="toolBtn ${state.mode==="wand"?"active":""}" data-action="wand">Magic Wand</button>
            <button class="toolBtn" data-action="similar-white">Remove Similar White</button>
          </div>
          ${state.mode==="smart-select"?`
            <div class="toolGrid smartControls">
              <button class="toolBtn ${state.smartPromptMode==="positive"?"active":""}" data-action="smart-add">+ Add</button>
              <button class="toolBtn ${state.smartPromptMode==="negative"?"active":""}" data-action="smart-subtract">− Subtract</button>
              <button class="toolBtn" data-action="smart-clear">Clear Selection</button>
              <button class="toolBtn" data-action="smart-remove" ${state.smartSelectionMask?"":"disabled"}>Remove Object</button>
              <button class="toolBtn primary full" data-action="smart-keep" ${state.smartSelectionMask?"":"disabled"}>Keep Object · Remove Background</button>
            </div>
            <div class="hint">${state.smartModelStatus==="loading"?"Loading Smart Select on this device…":state.smartBusy?"Tracing the object…":state.smartSelectionMask?"Selection ready. Use Add/Subtract for another tap, then keep or remove the object.":"Tap the object on the canvas. Smart Select loads only when you use it."}</div>
          `:`
            <div class="sliderRow">
              <label>Tolerance <span data-bind="tol">${state.tolerance}</span></label>
              <input data-action="tolerance" type="range" min="0" max="120" value="${state.tolerance}">
            </div>
            <div class="hint">Quick Remove handles simple backgrounds. Smart Select traces an object. Magic Wand removes connected areas by color.</div>
          `}'''
          replace_once(old_remove, new_remove, 'remove background controls')

          replace_once(
              '''    page.classList.toggle("hasImage",state.imageLoaded);
    wireControls();''',
              '''    page.classList.toggle("hasImage",state.imageLoaded);
    page.classList.toggle("hasSmartSelection",!!state.smartSelectionMask);
    wireControls();''',
              'render smart class'
          )

          replace_once(
              '''      if(a==="quick-remove") el.onclick=quickRemove;
      if(a==="wand") el.onclick=()=>setMode(state.mode==="wand"?null:"wand",true);''',
              '''      if(a==="quick-remove") el.onclick=quickRemove;
      if(a==="smart-select") el.onclick=activateSmartSelect;
      if(a==="smart-add") el.onclick=()=>setSmartPromptMode("positive");
      if(a==="smart-subtract") el.onclick=()=>setSmartPromptMode("negative");
      if(a==="smart-clear") el.onclick=clearSmartSelection;
      if(a==="smart-keep") el.onclick=keepSmartSelection;
      if(a==="smart-remove") el.onclick=removeSmartSelection;
      if(a==="wand") el.onclick=()=>setMode(state.mode==="wand"?null:"wand",true);''',
              'wire smart controls'
          )

          replace_once(
              '''  function selectStudio(key){
    state.studio=key;
    if(key!=="extract") state.mode=null;''',
              '''  function selectStudio(key){
    state.studio=key;
    if(key!=="extract"){
      if(state.mode==="smart-select") resetSmartSelection(false);
      state.mode=null;
    }''',
              'studio smart cleanup'
          )

          replace_once(
              '''  function setMode(mode, close=false){
    if(!state.imageLoaded && mode && mode!=="hand"){statusRight.textContent="Import an image first";return}
    state.mode=mode;
    if(mode==="wand") statusRight.textContent="Magic Wand: keep clicking areas to remove";''',
              '''  function setMode(mode, close=false){
    if(!state.imageLoaded && mode && mode!=="hand"){statusRight.textContent="Import an image first";return}
    if(state.mode==="smart-select"&&mode!=="smart-select") resetSmartSelection(false);
    state.mode=mode;
    if(mode==="smart-select") statusRight.textContent="Smart Select: tap an object";
    else if(mode==="wand") statusRight.textContent="Magic Wand: keep clicking areas to remove";''',
              'setMode smart support'
          )

          replace_once(
              '''      state.mode=null;
      statusRight.textContent=file.name;''',
              '''      state.mode=null;
      resetSmartSelection(true);
      statusRight.textContent=file.name;''',
              'load reset smart'
          )
          replace_once(
              '''    state.mode=null;
    statusRight.textContent="No image loaded";''',
              '''    state.mode=null;
    resetSmartSelection(true);
    statusRight.textContent="No image loaded";''',
              'clear reset smart'
          )

          smart_functions = r'''

  function resetSmartSelection(resetImage=false){
    state.smartSelectionMask=null;
    state.smartStrokes=[];
    state.smartPromptMode="positive";
    state.smartBusy=false;
    if(resetImage) state.smartImagePrepared=false;
    if(selectionOverlay.width!==canvas.width) selectionOverlay.width=canvas.width;
    if(selectionOverlay.height!==canvas.height) selectionOverlay.height=canvas.height;
    selectionCtx.clearRect(0,0,selectionOverlay.width,selectionOverlay.height);
    page.classList.remove("hasSmartSelection");
  }

  function clearSmartSelection(){
    resetSmartSelection(false);
    statusRight.textContent="Smart selection cleared — tap an object";
    render();
    if(window.matchMedia("(max-width:820px)").matches) closeDrawer();
  }

  async function ensureSmartSegmenter(){
    if(smartSegmenter) return smartSegmenter;
    state.smartModelStatus="loading";
    statusRight.textContent="Loading Smart Select on this device…";
    render();
    smartModule=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs");
    const vision=await smartModule.FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm"
    );
    smartSegmenter=await smartModule.InteractiveSegmenter.createFromModelPath(
      vision,
      "https://storage.googleapis.com/mediapipe-models/interactive_segmenter_v2/magic_touch/int8/1/interactive_segmentation.task"
    );
    state.smartModelStatus="ready";
    return smartSegmenter;
  }

  function prepareSmartImage(){
    if(!smartSegmenter||!state.original||!state.imageRect) return false;
    const r=state.imageRect;
    smartSourceCanvas.width=Math.max(1,r.w);
    smartSourceCanvas.height=Math.max(1,r.h);
    smartSourceCtx.clearRect(0,0,smartSourceCanvas.width,smartSourceCanvas.height);
    smartSourceCtx.putImageData(state.original,-r.x,-r.y);
    smartSegmenter.setImage(smartSourceCanvas);
    state.smartImagePrepared=true;
    state.smartStrokes=[];
    return true;
  }

  async function activateSmartSelect(){
    if(!state.imageLoaded){statusRight.textContent="Import an image first";return}
    if(state.mode==="smart-select"){
      setMode(null);
      return;
    }
    resetSmartSelection(false);
    state.mode="smart-select";
    state.smartPromptMode="positive";
    render();
    if(window.matchMedia("(max-width:820px)").matches) closeDrawer();
    try{
      await ensureSmartSegmenter();
      if(!state.smartImagePrepared&&!prepareSmartImage()) throw new Error("image setup failed");
      statusRight.textContent="Smart Select ready — tap an object";
      render();
    }catch(err){
      console.error("Smart Select unavailable",err);
      state.smartModelStatus="error";
      state.mode=null;
      statusRight.textContent="Smart Select could not load — Quick Remove and Magic Wand still work";
      render();
    }
  }

  function setSmartPromptMode(mode){
    if(state.mode!=="smart-select") return;
    state.smartPromptMode=mode;
    statusRight.textContent=mode==="negative"?"Subtract: tap an area to exclude":"Add: tap the object or an area to include";
    render();
    if(window.matchMedia("(max-width:820px)").matches) closeDrawer();
  }

  function smartResultMask(result){
    if(!result) return null;
    if(result.confidenceMasks&&result.confidenceMasks.length) return result.confidenceMasks[0];
    if(result.categoryMask) return result.categoryMask;
    if(typeof result.getAsFloat32Array==="function") return result;
    return null;
  }

  function copySmartMaskToPage(maskObj){
    const rect=state.imageRect;
    const values=maskObj.getAsFloat32Array();
    const mw=maskObj.width||rect.w;
    const mh=maskObj.height||rect.h;
    const full=new Uint8Array(canvas.width*canvas.height);
    for(let y=0;y<rect.h;y++){
      const sy=Math.min(mh-1,Math.floor(y*mh/rect.h));
      const py=rect.y+y;
      if(py<0||py>=canvas.height) continue;
      for(let x=0;x<rect.w;x++){
        const sx=Math.min(mw-1,Math.floor(x*mw/rect.w));
        const px=rect.x+x;
        if(px<0||px>=canvas.width) continue;
        if(values[sy*mw+sx]>=0.5) full[py*canvas.width+px]=1;
      }
    }
    return full;
  }

  function drawSmartOverlay(){
    selectionOverlay.width=canvas.width;
    selectionOverlay.height=canvas.height;
    selectionCtx.clearRect(0,0,selectionOverlay.width,selectionOverlay.height);
    const mask=state.smartSelectionMask;
    if(!mask){page.classList.remove("hasSmartSelection");return}
    const w=canvas.width,h=canvas.height;
    const out=selectionCtx.createImageData(w,h);
    const d=out.data;
    for(let y=0;y<h;y++){
      for(let x=0;x<w;x++){
        const i=y*w+x;
        if(!mask[i]) continue;
        const edge=x===0||y===0||x===w-1||y===h-1||!mask[i-1]||!mask[i+1]||!mask[i-w]||!mask[i+w];
        const p=i*4;
        d[p]=117;d[p+1]=215;d[p+2]=255;d[p+3]=edge?220:62;
      }
    }
    selectionCtx.putImageData(out,0,0);
    page.classList.add("hasSmartSelection");
  }

  async function smartSelectAt(e){
    if(state.mode!=="smart-select"||state.smartBusy||!smartSegmenter) return;
    const p=getPoint(e);if(!p||!state.imageRect)return;
    const r=state.imageRect;
    if(p.x<r.x||p.y<r.y||p.x>=r.x+r.w||p.y>=r.y+r.h){
      statusRight.textContent="Tap inside the imported image";
      return;
    }
    state.smartBusy=true;
    statusRight.textContent="Tracing object…";
    render();
    await new Promise(resolve=>requestAnimationFrame(resolve));
    try{
      if(!state.smartImagePrepared&&!prepareSmartImage()) throw new Error("image setup failed");
      const brushMode=state.smartPromptMode==="negative"?smartModule.BrushMode.NEGATIVE:smartModule.BrushMode.POSITIVE;
      state.smartStrokes.push({
        brushMode,
        point:[{x:(p.x-r.x)/r.w,y:(p.y-r.y)/r.h}],
        isCompleted:true
      });
      const result=smartSegmenter.segment(state.smartStrokes);
      const maskObj=smartResultMask(result);
      if(!maskObj) throw new Error("no segmentation mask returned");
      state.smartSelectionMask=copySmartMaskToPage(maskObj);
      if(result&&typeof result.close==="function") result.close();
      else if(maskObj&&typeof maskObj.close==="function") maskObj.close();
      drawSmartOverlay();
      statusRight.textContent=state.smartPromptMode==="negative"?"Selection updated — excluded that area":"Selection ready — keep, remove, or refine";
    }catch(err){
      console.error("Smart Select failed",err);
      statusRight.textContent="Smart Select failed on this tap — try another point";
    }finally{
      state.smartBusy=false;
      render();
      if(window.matchMedia("(max-width:820px)").matches&&state.smartSelectionMask) openDrawer();
    }
  }

  function finishSmartSelection(message){
    resetSmartSelection(false);
    state.mode=null;
    statusRight.textContent=message;
    render();
    closeDrawer();
  }

  function keepSmartSelection(){
    if(!state.smartSelectionMask||!state.original)return;
    pushHistory();
    const remove=new Uint8Array(canvas.width*canvas.height);
    const original=state.original.data;
    for(let i=0;i<remove.length;i++){
      if(original[i*4+3]>0&&!state.smartSelectionMask[i]) remove[i]=1;
    }
    state.baseRemovalMask=remove;
    state.manualEraseMask=null;
    state.manualRestoreMask=null;
    state.edgeFit=0;
    state.smoothEdge=0;
    applyCurrentBaseMask();
    finishSmartSelection("Smart Select kept the object and removed its background");
  }

  function removeSmartSelection(){
    if(!state.smartSelectionMask)return;
    pushHistory();
    addToBaseMask(state.smartSelectionMask);
    applyCurrentBaseMask();
    finishSmartSelection("Smart Select removed the selected object");
  }
'''
          marker = '  function quickRemove(){\n'
          if text.count(marker) != 1:
              raise SystemExit('smart function insertion marker missing')
          text = text.replace(marker, smart_functions + '\n' + marker, 1)

          replace_once(
              '''  function quickRemove(){
    if(!state.imageLoaded){''',
              '''  function quickRemove(){
    if(!state.imageLoaded){''',
              'quick remove anchor'
          )
          # Insert reset after the early guard block, before history capture.
          replace_once(
              '''      return;
    }

    pushHistory();
    ctx.putImageData(state.original,0,0);''',
              '''      return;
    }

    resetSmartSelection(false);
    pushHistory();
    ctx.putImageData(state.original,0,0);''',
              'quick remove smart reset'
          )

          replace_once(
              '''    canvas.addEventListener("pointerdown",e=>{
      if(state.mode==="wand"){magicWandAt(e);return}''',
              '''    canvas.addEventListener("pointerdown",e=>{
      if(state.mode==="smart-select"){smartSelectAt(e);return}
      if(state.mode==="wand"){magicWandAt(e);return}''',
              'smart pointer handler'
          )

          replace_once(
              '''      if(e.key==="Escape"){
        state.mode=null;''',
              '''      if(e.key==="Escape"){
        if(state.mode==="smart-select") resetSmartSelection(false);
        state.mode=null;''',
              'escape smart cleanup'
          )

          replace_once(
              'document.documentElement.dataset.imageLabBuild="6.8";',
              'document.documentElement.dataset.imageLabBuild="6.9";',
              'readiness build'
          )

          path.write_text(text)
          print('Applied Build 6.9 Smart Select patch.')
          PY

      - name: Static smoke test
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text()
          required=[
            'Build 6.9',
            'data-action="smart-select"',
            'data-action="smart-keep"',
            'data-action="smart-remove"',
            'InteractiveSegmenter.createFromModelPath',
            'document.documentElement.dataset.imageLabBuild="6.9"'
          ]
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('Missing Smart Select hooks: '+', '.join(missing))
          scripts=re.findall(r'<script>(.*?)</script>',text,re.S)
          if len(scripts)!=1: raise SystemExit(f'Expected one inline script, found {len(scripts)}')
          Path('/tmp/image-lab-app.js').write_text(scripts[0])
          PY
          node --check /tmp/image-lab-app.js

      - name: Install browser smoke runtime
        shell: bash
        run: |
          mkdir -p /tmp/image-lab-smoke
          npm install --prefix /tmp/image-lab-smoke playwright
          /tmp/image-lab-smoke/node_modules/.bin/playwright install --with-deps chromium

      - name: Browser smoke test Smart Select
        shell: bash
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/image-lab-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > /tmp/image-lab-smoke/smoke.cjs <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{ if(m.type()==='error') errors.push(m.text()); });
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.documentElement.dataset.imageLabBuild==='6.9');
            await page.locator('#fileInput').setInputFiles('icon-512.png');
            await page.waitForFunction(()=>document.querySelector('#page').classList.contains('hasImage'));
            await page.evaluate(()=>document.querySelector('[data-action="smart-select"]').click());
            await page.waitForFunction(()=>document.querySelector('#statusRight').textContent.includes('Smart Select ready'),null,{timeout:120000});
            const box=await page.locator('#canvas').boundingBox();
            if(!box) throw new Error('Canvas not visible');
            await page.mouse.click(box.x+box.width/2,box.y+box.height/2);
            await page.waitForFunction(()=>document.querySelector('#page').classList.contains('hasSmartSelection'),null,{timeout:120000});
            await page.waitForFunction(()=>{
              const b=document.querySelector('[data-action="smart-keep"]');
              return b&&!b.disabled;
            });
            await page.evaluate(()=>document.querySelector('[data-action="smart-keep"]').click());
            await page.waitForFunction(()=>!document.querySelector('#page').classList.contains('hasSmartSelection'));
            if(errors.length) throw new Error('Browser errors: '+errors.join(' | '));
            await browser.close();
            console.log('SMART SELECT SMOKE PASS');
          })().catch(err=>{console.error(err);process.exit(1)});
          JS
          (cd /tmp/image-lab-smoke && node smoke.cjs)

      - name: Commit Build 6.9 when tests pass
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Build 6.9: add on-device Smart Select object extraction'
          git push origin HEAD:feature/smart-select-6.9
